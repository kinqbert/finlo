name: finlo

services:
  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-finlo}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: golang:1.26.5-bookworm
    profiles: ["tools"]
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-finlo}?sslmode=${DB_SSL_MODE:-disable}
    volumes:
      - ./server:/workspace:ro,Z
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - |
        go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 \
          -dir migrations postgres "$${DATABASE_URL}" up
    restart: "no"

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
